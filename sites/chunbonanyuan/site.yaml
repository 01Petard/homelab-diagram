# One site = one directory: this file is the content, out/ gets the renders.
# build.py reads it; which renderer runs is decided by `layout` below, and the
# positions of the boxes are hand-placed in layouts/home.py.
# Everything here is either measured on this Mac (read-only) or explicitly marked as unknown.
# This is the flat in 春波南苑 (romanised for the render) — the network as it is today.

layout: home                        # home = trimmed single-segment layout (layouts/home.py)

meta:
  title: "Chunbonanyuan"             # 春波南苑 — romanised, Fira Sans has no CJK glyphs
  title_redacted: "Chunbonanyuan"
  date: "November 2026"
  watermark: "01Petard"
  domain: "lan"                      # there is no public domain on this network

redact:
  domain: false                      # private diagram: keep the real values
  domain_placeholder: "redacted.lan"

vlans:   # order = table order
  - {key: "10",  tag: "LAN",       name: LAN,     subnet: "192.168.1.0/24", color: "#58a6ff", note: "one flat segment · DHCP + DNS on the router"}
  - {key: "vpn", tag: "Tailscale", name: Tailnet, subnet: "100.64.0.0/10",   color: "#39c5cf", note: "overlay · this Mac, an ECS box, a phone"}
  - {key: "wan", tag: "ISP",       name: Uplink,  subnet: "—",              color: "#f85149", note: "ONT ⇄ router · mode not verified"}

internet:
  caption: "ISP speed unknown · semi-static IPv4"
  cloud_services:
    - {icon: glyph-cpu, name: "Aliyun ECS", note: "100.64.0.1 · linux · tailnet node"}

remote:
  name: "Remote access"
  note: "phone + laptop · Tailscale"

exposed:
  title: "Open to the internet"
  note: "nothing forwarded"
  sub: "ONT → router is the only NAT hop"

# device card format: name + type tag / full device name / IP · hostname / OS
isp:
  name: "ISP ONT"
  type: "modem"
  model: "GPON ONT · model unknown"
  ip: "no management IP"
  os: "ISP firmware"

router:
  name: "TP-Link"
  type: "router"
  model: "TP-Link wireless router"
  os: "stock firmware · version unknown"
  ip: "192.168.1.1"
  internal: router
  config: "the only router · no VLANs, no DMZ"
  lan_note: "one wired client · the rest join over Wi-Fi"
  clients:
    - {name: "MacBook Air", ip: "192.168.1.100", link: "1 Gbit", note: "wired · USB Ethernet"}
    - {name: "iPhone",      ip: "192.168.1.101", link: "Wi-Fi",  note: "DHCP · private MAC"}
    - {name: "Switch",      ip: "192.168.1.102", link: "Wi-Fi",  note: "DHCP · console"}
  hw:
    - {icon: glyph-nic,     label: "WAN",       value: "1 Gbit",      sub: "uplink from the ONT"}
    - {icon: glyph-nic,     label: "LAN",       value: "4× 1 Gbit",   sub: "one flat segment"}
    - {icon: glyph-antenna, label: "WI-FI",     value: "2.4 + 5 GHz", sub: "SSID not readable from macOS"}
    - {icon: glyph-dhcp,    label: "DHCP + DNS", value: "192.168.1.1", sub: "relays 114.114.114.114"}
  services:
    - {icon: glyph-dhcp,    name: "DHCP server", note: "whole /24 pool"}
    - {icon: glyph-nic,     name: "DNS relay",   note: "→ 114.114.114.114"}
    - {icon: glyph-block,   name: "NAT",         note: "no forwards set"}
    - {icon: glyph-antenna, name: "Wi-Fi AP",    note: "built-in radio"}
    - {icon: glyph-shield,  name: "UPnP / IGD",  note: "unverified"}

devices:
  mac:
    name: "MacBook Air"
    type: "laptop"
    model: "Apple M4 · 16 GB"
    os: "macOS 15.7.5"
    ip: "192.168.1.100"
    internal: hzx-mac
    vlan: "10"
    icons: [apple]
    link: eth
    speed: "1G"
  iphone:
    name: "iPhone"
    type: "phone"
    model: "iPhone · model unknown"
    os: "iOS"
    ip: "192.168.1.101"
    vlan: "10"
    icons: [apple]
    link: wifi
  console:
    name: "Switch"
    type: "console"
    model: "Nintendo Switch"
    ip: "192.168.1.102"
    vlan: "10"
    icons: [nintendo-switch]
    link: wifi

tailnet:
  - {name: "hzx-mac", ip: "100.64.0.3", os: "macOS", state: "online"}
  - {name: "ecs",     ip: "100.64.0.1", os: "linux", state: "online"}
  - {name: "qgs-mac", ip: "100.64.0.4", os: "macOS", state: "offline 3 h"}

notes:
  - "read on this Mac with read-only probes"
  - "router model + WAN mode: no login, unverified"
  - "ISP down/up speed and SSID: unknown"
  - "no NAS, no hypervisor, no VLANs here"
