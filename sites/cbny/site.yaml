# One site = one directory: this file is the content, layout.py next to it holds the
# hand-placed coordinates, out/ gets the renders.
# Everything here is either measured on this Mac (read-only) or explicitly marked as unknown.
# This is the flat in 春波南苑 (cbny) — swept again on 2026-11-11, late evening.

meta:
  title: "Chunbonanyuan"             # 春波南苑 — romanised, Fira Sans has no CJK glyphs
  title_redacted: "Chunbonanyuan"
  date: "November 2026"
  watermark: "01Petard"
  domain: "lan"                      # there is no public domain on this network

redact:
  domain: false                      # private diagram: keep the real values
  domain_placeholder: "redacted.lan"

vlans:   # order = table order
  - {key: "10",  tag: "LAN",       name: LAN,     subnet: "192.168.1.0/24", color: "#58a6ff", note: "one flat segment · DHCP + DNS on the router"}
  - {key: "vpn", tag: "Tailscale", name: Tailnet, subnet: "100.64.0.0/10",   color: "#39c5cf", note: "overlay · this Mac, an ECS box, a second Mac"}
  - {key: "wan", tag: "ISP",       name: Uplink,  subnet: "—",              color: "#f85149", note: "ONT ⇄ router · mode not verified"}

internet:
  caption: "China Telecom · 115.192.168.59"
  cloud_services:
    - {icon: glyph-cpu, name: "Aliyun ECS", note: "100.64.0.1 · linux · tailnet node"}

remote:
  name: "Remote access"
  note: "phone + laptop · Tailscale"

exposed:
  title: "Open to the internet"
  note: "nothing forwarded"
  sub: "ONT → router is the only NAT hop"

# device card format: name + type tag / full device name / IP · hostname / OS
isp:
  name: "ISP ONT"
  type: "modem"
  model: "GPON ONT · model unknown"
  ip: "no management IP"
  os: "ISP firmware"

router:
  name: "TP-Link"
  type: "router"
  model: "TP-Link WR740N · 802.11n 150M"
  os: "stock firmware · version unknown"
  ip: "192.168.1.1"
  internal: router
  wan_speed: "100M"                  # SPEED_W key: the ONT ⇄ router cable is drawn with this width
  config: "the only router · no VLANs, no DMZ"
  lan_note: "no wired client · everything joins over Wi-Fi"
  clients:
    - {name: "MacBook Air", ip: "192.168.1.104", link: "Wi-Fi", note: "private MAC · this Mac"}
    - {name: "iPhone",      ip: "192.168.1.101", link: "Wi-Fi", note: "DHCP · private MAC"}
    - {name: "unknown",     ip: "192.168.1.103", link: "Wi-Fi", note: "iOS device · type unknown"}
    - {name: "Switch",      ip: "192.168.1.102", link: "Wi-Fi", note: "DHCP · Nintendo OUI"}
  hw:
    - {icon: glyph-nic,     label: "WAN",       value: "100 Mbit",          sub: "uplink from the ONT"}
    - {icon: glyph-nic,     label: "LAN",       value: "4× 100 Mbit",       sub: "one flat segment"}
    - {icon: glyph-antenna, label: "WI-FI",     value: "2.4 GHz · 802.11n", sub: "ch 1 · 20 MHz · WPA2"}
    - {icon: glyph-dhcp,    label: "DHCP + DNS", value: "192.168.1.1",      sub: "also hands out 192.168.0.1"}
  services:
    - {icon: glyph-dhcp,    name: "DHCP server", note: "whole /24 pool"}
    - {icon: glyph-nic,     name: "DNS relay",   note: "resolves · 2nd NS odd"}
    - {icon: glyph-block,   name: "NAT",         note: "no forwards set"}
    - {icon: glyph-antenna, name: "Wi-Fi AP",    note: "2.4 GHz radio"}
    - {icon: glyph-shield,  name: "UPnP / IGD",  note: "unverified"}

devices:
  mac:
    name: "MacBook Air"
    type: "laptop"
    model: "Apple M4 · 16 GB"
    os: "macOS 15.7.5"
    ip: "192.168.1.104"
    internal: hzx-mac
    vlan: "10"
    icons: [apple]
    link: wifi
  iphone:
    name: "iPhone"
    type: "phone"
    model: "iPhone · model unknown"
    os: "iOS"
    ip: "192.168.1.101"
    vlan: "10"
    icons: [apple]
    link: wifi
  ios:
    name: "unknown"
    type: "iOS device"
    model: "model unknown"
    ip: "192.168.1.103"
    vlan: "10"
    icons: [apple]
    link: wifi
  console:
    name: "Switch"
    type: "console"
    model: "Nintendo Switch"
    ip: "192.168.1.102"
    vlan: "10"
    icons: [nintendo-switch]
    link: wifi

tailnet:
  - {name: "hzx-mac", ip: "100.64.0.3", os: "macOS", state: "online"}
  - {name: "ecs",     ip: "100.64.0.1", os: "linux", state: "online"}
  - {name: "qgs-mac", ip: "100.64.0.4", os: "macOS", state: "idle"}

notes:
  - "read on this Mac with read-only probes"
  - "router model from its own www-auth realm: WR740N"
  - "no login attempted → WAN mode, forwards, DHCP pool unverified"
  - "ISP down/up speed and SSID: unknown (macOS needs location access)"
  - "no NAS, no hypervisor, no VLANs here"
