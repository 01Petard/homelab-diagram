    - '40'
    - '99'
  - name: ether2
    to: OPNsense
    tagged:
    - '10'
    - '20'
    - '30'
    - '40'
    - '99'
  - name: ether3
    to: MADCAT
    untagged: '10'
  - name: ether4
    to: free
    tagged:
    - '10'
    - '20'
    - '40'
    short: 空闲
  - name: ether5
    to: JetKVM
    untagged: '10'
  - name: ether6
    to: U7 Lite
    untagged: '99'
    tagged:
    - '10'
    - '30'
    - '40'
  - name: ether7
    to: SLZB-MR4
    untagged: '40'
  - name: ether8
    to: rescue
    untagged: '99'
