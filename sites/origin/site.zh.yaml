# 中文版内容；保留英文版的网络拓扑、地址、设备型号及服务标识。
meta:
  title: 我的家庭实验室
  title_redacted: 我的家庭实验室
  date: 2026 年 11 月
  watermark: u/goblinmine
  domain: example.com
redact:
  domain: true
  domain_placeholder: redacted.com
  ssid_names: true
vlans:
- key: '10'
  tag: VLAN 10
  name: 内网
  subnet: 10.0.10.0/24
  color: '#58a6ff'
  note: 可信网络 · 可管理其他 VLAN
- key: '20'
  tag: VLAN 20
  name: 服务区
  subnet: 10.0.20.0/24
  color: '#f0883e'
  note: 服务网络 · 不可访问内网、访客及管理网
- key: '30'
  tag: VLAN 30
  name: 访客
  subnet: 10.0.30.0/24
  color: '#bc8cff'
  note: 仅互联网及 NAS 公共共享
- key: '40'
  tag: VLAN 40
  name: 物联网
  subnet: 10.0.40.0/24
  color: '#3fb950'
  note: 仅互联网 · 为 HA 开放特定访问
- key: '99'
  tag: VLAN 99
  name: 管理
  subnet: 10.0.99.0/24
  color: '#e3b341'
  note: 管理界面 · 仅内网与 VPN 可访问
- key: vpn
  tag: WireGuard
  name: VPN
  subnet: 10.0.50.0/24
  color: '#39c5cf'
  note: 分流隧道 · 可访问内网，不转发互联网
- key: wan
  tag: Fritzbox
  name: 外网
  subnet: 192.168.178.0/24
  color: '#f85149'
  note: 非可信网络 · OPNsense 上联 Fritzbox
internet:
  speed:
    down: 600 Mbit/s
    up: 50 Mbit/s
  cloud_services:
  - icon: cloudflare
    name: Cloudflare
    note: DNS · *.{domain} · DNS-01 泛域名证书
  - icon: backblaze
    name: Backblaze B2
    note: NAS 数据异地备份
fritzbox:
  name: FRITZ!Box
  type: 运营商路由器
  model: AVM FRITZ!Box 6660 Cable
  ip: 192.168.178.1
  os: FRITZ!OS 8.25
  lan_ports:
  - 2.5G
  - 1G
  - 1G
  - 1G
  - 1G
  opnsense_port: 1
opnsense:
  name: OPNsense
  type: 路由器 / 防火墙
  model: 联想瘦客户机
  os: OPNsense 26.7
  hw:
  - icon: glyph-cpu
    label: CPU
    value: i3-9100T
    sub: 4 核 · 4 线程
  - icon: glyph-ram
    label: 内存
    value: 12 GB DDR4
    sub: 根文件系统使用 ZFS
  - icon: glyph-nic
    label: 网络
    value: 双 2.5G Intel
    sub: LACP 连接交换机
  - icon: glyph-nic
    label: 网络
    value: 板载 1G
    sub: WAN 上联 Fritzbox
  ip: 10.0.99.1
  internal: opnsense
  nic_note: LACP · dual 2.5G Intel NIC
  wan_ip: '.20'
  services:
  - icon: adguard
    name: AdGuard Home
    note: 为所有 VLAN 提供 DNS
  - icon: glyph-dhcp
    name: dnsmasq
    note: DHCP + *.internal
  - icon: wireguard
    name: WireGuard
    note: wg0 · UDP 51820
  - icon: glyph-shield
    name: Suricata IPS
    note: 出站流量检测
  - icon: crowdsec
    name: CrowdSec
    note: LAPI + pf bouncer
  - icon: glyph-block
    name: pf blocklist
    note: WAN 侧约 2300 个恶意 IP
