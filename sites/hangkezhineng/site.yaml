# One site = one directory: this file is the content, layout.py next to it holds the
# hand-placed coordinates, out/ gets the renders.
# Every value below was measured on this Mac with read-only probes on 2026-11-11:
# ping sweep of the /24, TCP connect scan, reverse DNS on the gateway, SSH/HTTP banners,
# ARP for MAC vendors. No credentials were used and nothing was changed.
# Items that a probe could not settle are written as "unknown" instead of guessed.

meta:
  title: "Hangkezhineng"             # directory slug; the picture is titled the same
  title_redacted: "Hangkezhineng"
  date: "November 2026"
  watermark: "01Petard"
  domain: "lan"

redact:
  domain: false

vlans:   # order = table order
  - {key: "10",  tag: "LAN",       name: "Office LAN", subnet: "192.168.10.0/24", color: "#58a6ff", note: "one flat segment · 12 clients + gateway seen"}
  - {key: "vpn", tag: "Tailscale", name: Tailnet,     subnet: "100.64.0.0/10",   color: "#39c5cf", note: "overlay on this Mac · 3 nodes, 1 idle"}
  - {key: "wan", tag: "ISP",       name: Uplink,      subnet: "—",              color: "#f85149", note: "fiber into the gateway · speed and mode unknown"}

internet:
  caption: "ISP mode unknown · egress via a proxy"

gateway:
  name: "YouHua"
  type: "ONT + router + AP"
  model: "YouHua gateway · model unverified"
  ip: "192.168.10.1"
  os: "ISP firmware · reverse DNS wowifi.smartont.net"
  hw:
    - {icon: glyph-nic,     label: "WAN",        value: "fiber",            sub: "speed + mode unknown"}
    - {icon: glyph-nic,     label: "LAN",        value: "ports unknown",    sub: "one flat segment"}
    - {icon: glyph-antenna, label: "WI-FI",      value: "802.11ax · 5 GHz", sub: "ch 149 · 80 MHz · WPA2"}
    - {icon: glyph-dhcp,    label: "DHCP + DNS", value: "192.168.10.1",     sub: "lease 24 h · /24 pool"}
  mgmt:
    - "web UI on 80 / 443 · Server: HSANHomeGateway"
    - "no login attempted → model, WAN mode, port forwards unverified"

# client card: name + kind / ip / mac vendor / what is listening
# kind drives the colour and the legend: laptop, pc, server, phone, printer, unknown
clients:
