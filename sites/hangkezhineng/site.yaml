# kind → colour, also the order of the legend
kinds:
  - {key: gateway, label: "gateway",        color: "#f85149"}
  - {key: laptop,  label: "laptop",         color: "#79c0ff"}
  - {key: pc,      label: "Windows PC",     color: "#58a6ff"}
  - {key: server,  label: "Linux host",     color: "#3fb950"}
  - {key: phone,   label: "phone / tablet", color: "#39c5cf"}
  - {key: printer, label: "printer",        color: "#c08a5c"}
  - {key: unknown, label: "unidentified",   color: "#5d6a7c"}

probes:
  title: "How this was read"
  lines:
    - "ping sweep of 192.168.10.0/24 → 12 clients + gateway"
    - "TCP connect scan: 22 80 443 445 554 8009 9100 62078"
    - "reverse DNS on the gateway → 6 hostnames"
    - "SSH + HTTP banners read, ARP for MAC vendors"
    - "read-only: no logins, nothing changed"

overlays:
  title: "Egress & overlays"
  host_label: "THIS HOST"
  host_lines:
    - "en0 · 192.168.10.172/24 · 802.11ax ch 149"
    - "private MAC 12:80:85:3c:2f:84 · hardware 2c:ca:16:2d:86:f2"
  tail_label: "TAILNET"
  tailnet:
    - {name: "hzx-mac", ip: "100.64.0.3", os: "macOS", state: "online"}
    - {name: "ecs",     ip: "100.64.0.1", os: "linux", state: "online"}
    - {name: "qgs-mac", ip: "100.64.0.4", os: "macOS", state: "idle"}
  egress_label: "EGRESS"
  egress_lines:
    - "utun9 198.18.0.1 · default routes hijacked"
    - "observed 141.11.146.63 · HK · AS134972"
    - "a proxy, not the network's real ISP uplink"

notes:
  - "13 hosts on the segment: the gateway plus 12 clients"
  - "no VLANs, no switch management, no DMZ observed"
  - "gateway model + WAN mode: no login, unverified"
  - "laptop, phone and Linux MACs are randomised"
  - "SSID needs location permission on macOS 15"
