  - {ip: "192.168.10.11",  name: "unknown",         kind: server,  icon: glyph-cpu,   mac: "private MAC",              ports: "22/tcp SSH · OpenSSH 10.3"}
  - {ip: "192.168.10.19",  name: "unknown",         kind: phone,   icon: apple,       mac: "private MAC",              ports: "62078/tcp iOS lockdown"}
  - {ip: "192.168.10.55",  name: "unknown",         kind: phone,   icon: apple,       mac: "private MAC",              ports: "62078/tcp iOS lockdown"}
  - {ip: "192.168.10.83",  name: "iQOO-15-Ultra",   kind: phone,   icon: android,     mac: "vivo · private MAC",       ports: "no TCP port answered"}
  - {ip: "192.168.10.116", name: "unknown",         kind: server,  icon: glyph-cpu,   mac: "private MAC",              ports: "22/tcp SSH · OpenSSH 10.5"}
  - {ip: "192.168.10.172", name: "hzx-mac",         kind: laptop,  icon: apple,       mac: "this Mac · Apple silicon",  ports: "445/tcp local SMB"}
  - {ip: "192.168.10.187", name: "unknown",         kind: unknown, icon: none,        mac: "private MAC",              ports: "no TCP port answered"}
  - {ip: "192.168.10.193", name: "unknown",         kind: printer, icon: printer,     mac: "Canon",                    ports: "no TCP port answered"}
